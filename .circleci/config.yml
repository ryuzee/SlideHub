# CircleCI の設定（config version 2.1）
# https://circleci.com/docs/configuration-reference/
version: 2.1

orbs:
  # イメージ付属の Node は古い（20.18）ので、.node-version と同じ 22 系を入れる
  node: circleci/node@7
  # ブラウザを使うテスト（spec/system の js: true）のための Chrome と ChromeDriver
  browser-tools: circleci/browser-tools@1

jobs:
  build:
    working_directory: ~/SlideHub
    docker:
      - image: cimg/ruby:3.4.12-node
        environment:
          OSS_DB_URL_TEST: 127.0.0.1
          OSS_DB_USERNAME_TEST: 'root'
          OSS_DB_PASSWORD_TEST: ''
          OSS_REGION: ap-northeast-1
          OSS_IMAGE_BUCKET_NAME: ossfiles-dev
          OSS_SECRET_KEY_BASE: dummy
          OSS_USE_AZURE: 0
          RAILS_ENV: test
          RACK_ENV: test
          CIRCLE_ARTIFACTS: /tmp/artifacts
      - image: cimg/mysql:5.7
        environment:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'

    steps:
      - checkout
      - node/install:
          node-version: '22'
          install-yarn: true
      - run:
          name: Install system packages
          command: |
            sudo apt-get update
            sudo apt-get install -y build-essential ruby-dev libmysqlclient-dev libsqlite3-dev pkg-config libmagickcore-dev libmagickwand-dev mupdf-tools poppler-utils
      - browser-tools/install-chrome
      - browser-tools/install-chromedriver

      - run:
          name: Build JavaScript and CSS
          command: |
            node --version
            yarn install --frozen-lockfile
            yarn build
            yarn build:css

      - restore_cache:
          keys:
            - v2-dep-{{ .Branch }}-{{ checksum "Gemfile.lock" }}
            - v2-dep-{{ .Branch }}-
            - v2-dep-master-
      - run:
          name: Install gems
          command: |
            gem install bundler:2.3.27
            bundle config set --local path vendor/bundle
            bundle check || bundle install --jobs=4 --retry=3
      - save_cache:
          key: v2-dep-{{ .Branch }}-{{ checksum "Gemfile.lock" }}
          paths:
            - vendor/bundle

      - run:
          name: Wait for MySQL
          command: dockerize -wait tcp://127.0.0.1:3306 -timeout 2m
      - run:
          name: Set up database
          command: bundle exec rake db:create db:migrate

      - run:
          name: Run specs
          command: |
            mkdir -p /tmp/test-results/rspec /tmp/artifacts
            bundle exec rspec --color --require spec_helper \
              --format RspecJunitFormatter --out /tmp/test-results/rspec/rspec.xml \
              --format progress spec

      - store_test_results:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results
      - store_artifacts:
          path: /tmp/artifacts

workflows:
  build:
    jobs:
      - build
